<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Editor — Bubloo Scientist</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="admin.js" defer></script></head><body><main class="admin"><a href="/">← Back to website</a><p class="eyebrow">BUBLOO SCIENTIST</p><h1>Editor workspace</h1><p role="status" id="status"></p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Sign in</button></form><div id="workspace" hidden><button id="logout" class="button">Sign out</button><h2>Write an article</h2><form id="editor"><input type="hidden" name="id"><label>Title<input name="title" maxlength="200" required></label><label>Category<select name="category"><option>Physics</option><option>Chemistry</option><option>Biology</option><option>Technology</option><option>Book reviews</option></select></label><label>Excerpt<input name="excerpt" maxlength="1000" required></label><label>Article text<textarea name="body" maxlength="100000" required></textarea></label><label><input type="checkbox" name="published" style="width:auto;display:inline"> Published</label><button class="button">Save article</button><button type="reset">New article</button></form><h2>Your articles</h2><div id="article-list"></div><h2>Messages</h2><div id="messages"></div></div></main></body></html>
